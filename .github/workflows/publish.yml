name: Publish Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK from source repo
        run: |
          set -e
          curl -sSL -o HonorLocalOTA.apk \
            https://github.com/oopnv70-lab/HonorLocalOTA/releases/download/build-29/HonorLocalOTA.apk
          ls -l HonorLocalOTA.apk
          sha256sum HonorLocalOTA.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release create 4-2.2 HonorLocalOTA.apk \
            --repo "${{ github.repository }}" \
            --title "2.2" \
            --notes "首个版本。

          - 恢复荣耀「软件更新」的本地更新入口
          - 可分别开关「屏蔽新版本提示」与「强制请求全量包」
          - 适配「软件更新」2.1.1.1 (versionCode 205)" \
            --verify-tag
